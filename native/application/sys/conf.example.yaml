server:
  port: 9011

grpc:
  port: 9111

registry:
  driver: consul
  address: http://127.0.0.1:8500

service:
  id: ""

database:
  dsn: "host=127.0.0.1 user=postgres password=post123 dbname=microservice_kit port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetimeMinutes: 60
  slowThreshold: 500

redis:
  addr: 127.0.0.1:6379
  password: "123456"
  db: 0

auth:
  tokenHeader: Authorization

cors:
  enabled: false

workers:
  logCleanup:
    enabled: true
    cron: "0 0 2 * * *"
    retentionDays: 90
    lockTTLMinutes: 60
