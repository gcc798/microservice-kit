server:
  port: 9012

grpc:
  port: 9112

registry:
  driver: consul
  address: http://127.0.0.1:8500

service:
  id: ""

database:
  dsn: "host=127.0.0.1 user=postgres password=post123 dbname=microservice_kit port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetimeMinutes: 60
  slowThreshold: 500

redis:
  addr: 127.0.0.1:6379
  password: "123456"
  db: 0

storage:
  endpoint: 127.0.0.1:9000
  accessKey: rustfsadmin
  secretKey: rustfsadmin
  region: us-east-1
  bucket: microservice-kit
  useSSL: false

auth:
  tokenHeader: Authorization

cors:
  enabled: false

workers:
  expiredAttachmentCleanup:
    enabled: true
    cron: "0 0 2 * * *"
    lockTTLMinutes: 60
