x-database-environment: &database-environment
  MS_K_APP_ENV: prod
  MS_K_DATABASE_DSN: "host=postgres user=postgres password=${MS_K_POSTGRES_PASSWORD:-post123} dbname=microservice_kit port=5432 sslmode=disable TimeZone=Asia/Shanghai"

x-registry-environment: &registry-environment
  MS_K_REGISTRY_DRIVER: consul
  MS_K_REGISTRY_ADDRESS: http://consul:8500

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args: { TARGET: gateway }
    ports: ["9009:9009"]
    environment:
      <<: *registry-environment
      MS_K_APP_ENV: prod
      MS_K_SERVER_PORT: 9009
      MS_K_SERVICE_ID: ""
    depends_on:
      iam: { condition: service_healthy }
      sys: { condition: service_healthy }
      resource: { condition: service_healthy }
      realtime: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9009/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  iam:
    build:
      context: .
      dockerfile: Dockerfile
      args: { TARGET: iam }
    environment:
      <<: [*database-environment, *registry-environment]
      MS_K_SERVER_PORT: 9010
      MS_K_GRPC_PORT: 9110
      MS_K_REDIS_ADDR: redis:6379
      MS_K_REDIS_PASSWORD: "${MS_K_REDIS_PASSWORD:-123456}"
      MS_K_JWT_SECRET: "${MS_K_JWT_SECRET:?set MS_K_JWT_SECRET}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9010/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sys:
    build:
      context: .
      dockerfile: Dockerfile
      args: { TARGET: sys }
    environment:
      <<: [*database-environment, *registry-environment]
      MS_K_SERVER_PORT: 9011
      MS_K_GRPC_PORT: 9111
      MS_K_REDIS_ADDR: redis:6379
      MS_K_REDIS_PASSWORD: "${MS_K_REDIS_PASSWORD:-123456}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9011/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  resource:
    build:
      context: .
      dockerfile: Dockerfile
      args: { TARGET: resource }
    environment:
      <<: [*database-environment, *registry-environment]
      MS_K_SERVER_PORT: 9012
      MS_K_GRPC_PORT: 9112
      MS_K_STORAGE_ENDPOINT: rustfs:9000
      MS_K_STORAGE_ACCESS_KEY: "${MS_K_RUSTFS_ACCESS_KEY:-rustfsadmin}"
      MS_K_STORAGE_SECRET_KEY: "${MS_K_RUSTFS_SECRET_KEY:-rustfsadmin}"
      MS_K_STORAGE_REGION: us-east-1
      MS_K_STORAGE_BUCKET: "${MS_K_RUSTFS_BUCKET:-microservice-kit}"
      MS_K_STORAGE_USE_SSL: "false"
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9012/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      args: { TARGET: realtime }
    environment:
      <<: *registry-environment
      MS_K_APP_ENV: prod
      MS_K_SERVER_PORT: 9013
      MS_K_GRPC_PORT: 9113
      MS_K_REDIS_ADDR: redis:6379
      MS_K_REDIS_PASSWORD: "${MS_K_REDIS_PASSWORD:-123456}"
    depends_on:
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
      iam: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9013/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args: { TARGET: scheduler }
    environment:
      <<: [*database-environment, *registry-environment]
      MS_K_SERVICE_ID: ""
    depends_on:
      sys: { condition: service_healthy }
      resource: { condition: service_healthy }
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.21
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports: ["8501:8500"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${MS_K_POSTGRES_PASSWORD:-post123}"
      POSTGRES_DB: microservice_kit
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microservice_kit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${MS_K_REDIS_PASSWORD:-123456}"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${MS_K_REDIS_PASSWORD:-123456}' ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${MS_K_RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${MS_K_RUSTFS_SECRET_KEY:-rustfsadmin}"
    volumes: ["rustfs-data:/data"]
    depends_on:
      rustfs-volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rustfs-volume-init:
    image: alpine:3.22
    user: "0:0"
    volumes: ["rustfs-data:/data"]
    command: ["sh", "-c", "chown -R 10001:10001 /data"]

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
