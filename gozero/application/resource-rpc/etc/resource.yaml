Name: resource-rpc
ListenOn: 0.0.0.0:9003
Mode: dev
DevServer:
  Enabled: true
  Port: 6063
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: resource.rpc

Postgres:
  Dsn: "host=127.0.0.1 user=postgres password=post123 dbname=microservice_kit port=5433 sslmode=disable TimeZone=Asia/Shanghai"
  MaxIdleConns: 10
  MaxOpenConns: 100
  ConnMaxLifetimeMinutes: 60

Redis:
  Addr: "127.0.0.1:6379"
  Password: "123456"
  Db: 0

Storage:
  Endpoint: "127.0.0.1:9000"
  AccessKey: "rustfsadmin"
  SecretKey: "rustfsadmin"
  Bucket: "microservice-kit"
  Region: "us-east-1"
  UseSSL: false

Workers:
  ExpiredAttachmentCleanup:
    Enabled: true
    Cron: "0 0 2 * * *"
    LockTTLMinutes: 60
