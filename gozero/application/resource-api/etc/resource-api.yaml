Name: resource-api
Host: 0.0.0.0
Port: 9013
Mode: dev
DevServer:
  Enabled: true
  Port: 6073
  EnableMetrics: true
  EnablePprof: false
TraceIgnorePaths:
  - /health
  - /health/live
  - /health/ready
  - /health/startup

ResourceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: resource.rpc
  NonBlock: true

HTTPRegistry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: /microservice-kit/http/resource-api

Jwt:
  Secret: "your-256-bit-secret"
  Expire: 7200

Auth:
  TokenHeader: "Authorization"
