Name: gateway
Host: 0.0.0.0
Port: 9009

DevServer:
  Enabled: true
  Port: 6060
  EnableMetrics: true
  EnablePprof: false

Auth:
  TokenHeader: "Authorization"

IamRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: iam.rpc
  NonBlock: true

SysRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: sys.rpc
  NonBlock: true

HTTPRegistry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: /microservice-kit/http

ServiceRegistry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: /microservice-kit/services/gateway
