Name: iam-api
Host: 0.0.0.0
Port: 9011
Mode: dev
DevServer:
  Enabled: true
  Port: 6071
  EnableMetrics: true
  EnablePprof: false
TraceIgnorePaths:
  - /health
  - /health/live
  - /health/ready
  - /health/startup

IamRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: iam.rpc
  NonBlock: true

HTTPRegistry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: /microservice-kit/http/iam-api

Redis:
  Addr: "127.0.0.1:6379"
  Password: "123456"
  Db: 0

Jwt:
  Secret: "your-256-bit-secret"
  Expire: 7200

Auth:
  TokenHeader: "Authorization"
  AllowConcurrent: false
